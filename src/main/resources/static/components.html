<!DOCTYPE html>

<h2>Components</h2>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Internal number</th>
        <th>Name</th>
        <th>External part number</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody id="componentTable">
    </tbody>
</table>

<h2>Add component</h2>

<form id="componentForm">

    <label>Internal number:</label>
    <input type="number" id="internalNumber" required>

    <br><br>

    <label>Name:</label>
    <input type="text" id="name" required>

    <br><br>

    <label>External part number:</label>
    <input type="text" id="externalPartNumber" required>

    <br><br>

    <label>Supplier ID:</label>
    <input type="number" id="supplierId" required>

    <br><br>

    <button type="submit">Create component</button>

</form>

<script src="components.js"></script>

</body>
</html>
